<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Report</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="dashboard">

<header class="top-bar">

<h2>New Incident Report</h2>

<a href="user-dashboard.html" class="logout-btn">
<i class="fa-solid fa-arrow-left"></i>
Back
</a>

</header>

<form class="incident-form">

<label>Incident Type</label>

<select>

<option>Select Incident</option>

<option>Malware</option>

<option>Phishing</option>

<option>DDoS</option>

<option>Unauthorized Access</option>

<option>Data Breach</option>

<option>Other</option>

</select>


<label>Incident Title</label>

<input type="text" placeholder="Enter Incident Title">


<label>Description</label>

<textarea rows="5" placeholder="Describe the incident"></textarea>


<label>Date</label>

<input type="date">


<label>IP Address</label>

<input type="text" placeholder="192.168.1.1">


<label>Severity</label>

<select>

<option>Low</option>

<option>Medium</option>

<option>High</option>

<option>Critical</option>

</select>


<label>Upload Evidence</label>

<input type="file">


<br><br>

<button class="login-btn">

Submit Report

</button>

</form>

</div>

</body>

</html>
