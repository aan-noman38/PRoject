<!DOCTYPE html>
<html lang="en">

<title>Incident Details</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<body>

<div class="dashboard">

<header class="top-bar">

<h2>Incident Details</h2>

<a href="user-dashboard.html" class="logout-btn">
Back
</a>

</header>

<div class="incident-form">

<label>Incident ID</label>
<input type="text" value="INC001" readonly>

<label>Incident Type</label>
<input type="text" value="Phishing" readonly>

<label>Incident Title</label>
<input type="text" value="Email Phishing Attack" readonly>

<label>Description</label>
<textarea rows="4" readonly>
Fake login email received from unknown sender.
</textarea>

<label>Date</label>
<input type="text" value="07-08-2026" readonly>

<label>IP Address</label>
<input type="text" value="192.168.1.10" readonly>

<label>Severity</label>
<input type="text" value="High" readonly>

<label>Status</label>
<input type="text" value="Pending" readonly>

<label>Assigned SOC</label>
<input type="text" value="SOC-01" readonly>

</div>

</div>
